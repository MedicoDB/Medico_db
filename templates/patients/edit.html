{% extends "layout.html" %}

{% block title %}Edit Patient: {{ patient.patient_id }} - Hospital Management System{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1><i class="bi bi-pencil-square"></i> Edit Patient: {{ patient.patient_id }}</h1>
                <a href="{{ url_for('patient_view', patient_id=patient.patient_id) }}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Back to Patient
                </a>
            </div>

            <div class="card">
                <div class="card-header bg-warning text-dark">
                    <h5 class="mb-0">Patient Information</h5>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('patient_edit', patient_id=patient.patient_id) }}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="first_name" class="form-label">First Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="first_name" name="first_name" 
                                       value="{{ patient.first_name }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="last_name" class="form-label">Last Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="last_name" name="last_name" 
                                       value="{{ patient.last_name }}" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="dob" class="form-label">Date of Birth <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="dob" name="dob" 
                                       value="{{ patient.dob.strftime('%Y-%m-%d') if patient.dob else '' }}" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="age" class="form-label">Age <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="age" name="age" min="0" max="150" 
                                       value="{{ patient.age }}" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="gender" class="form-label">Gender <span class="text-danger">*</span></label>
                                <select class="form-select" id="gender" name="gender" required>
                                    <option value="">Select Gender</option>
                                    <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
                                    <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
                                    <option value="Other" {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="ethnicity" class="form-label">Ethnicity <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="ethnicity" name="ethnicity" 
                                       value="{{ patient.ethnicity }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="marital_status" class="form-label">Marital Status</label>
                                <select class="form-select" id="marital_status" name="marital_status">
                                    <option value="unknown" {% if patient.marital_status == 'unknown' %}selected{% endif %}>Unknown</option>
                                    <option value="Single" {% if patient.marital_status == 'Single' %}selected{% endif %}>Single</option>
                                    <option value="Married" {% if patient.marital_status == 'Married' %}selected{% endif %}>Married</option>
                                    <option value="Divorced" {% if patient.marital_status == 'Divorced' %}selected{% endif %}>Divorced</option>
                                    <option value="Widowed" {% if patient.marital_status == 'Widowed' %}selected{% endif %}>Widowed</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label">Address</label>
                            <input type="text" class="form-control" id="address" name="address" 
                                   value="{{ patient.address or '' }}">
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="city" class="form-label">City</label>
                                <input type="text" class="form-control" id="city" name="city" 
                                       value="{{ patient.city or '' }}">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="state" class="form-label">State</label>
                                <input type="text" class="form-control" id="state" name="state" 
                                       value="{{ patient.state or '' }}">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="zip" class="form-label">ZIP Code</label>
                                <input type="text" class="form-control" id="zip" name="zip" 
                                       value="{{ patient.zip or '' }}">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="phone" class="form-label">Phone</label>
                                <input type="tel" class="form-control" id="phone" name="phone" 
                                       value="{{ patient.phone or '' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" 
                                       value="{{ patient.email or '' }}">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="insurance_type" class="form-label">Insurance Type</label>
                                <select class="form-select" id="insurance_type" name="insurance_type">
                                    <option value="">Select Insurance</option>
                                    {% for insurer in insurers %}
                                    <option value="{{ insurer.code }}" 
                                            {% if patient.insurance_type == insurer.code %}selected{% endif %}>
                                        {{ insurer.name }} ({{ insurer.code }})
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="registration_date" class="form-label">Registration Date <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="registration_date" name="registration_date" 
                                       value="{{ patient.registration_date.strftime('%Y-%m-%d') if patient.registration_date else '' }}" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{{ url_for('patient_view', patient_id=patient.patient_id) }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-warning">
                                <i class="bi bi-check-circle"></i> Update Patient
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
