{% extends "layout.html" %}
{% block title %}Edit Insurer{% endblock %}
{% block content %}
<div class="container" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-warning text-dark">
            <h5 class="mb-0">Edit Insurer</h5>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Company Code</label>
                    <input type="text" class="form-control" name="code" value="{{ insurer.code }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Company Name</label>
                    <input type="text" class="form-control" name="name" value="{{ insurer.name }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Payer Type</label>
                    <select class="form-select" name="payer_type">
                        <option value="Private" {% if insurer.payer_type == 'Private' %}selected{% endif %}>Private</option>
                        <option value="Public" {% if insurer.payer_type == 'Public' %}selected{% endif %}>Public (Government)</option>
                        <option value="Medicare" {% if insurer.payer_type == 'Medicare' %}selected{% endif %}>Medicare</option>
                        <option value="Medicaid" {% if insurer.payer_type == 'Medicaid' %}selected{% endif %}>Medicaid</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="text" class="form-control" name="phone" value="{{ insurer.phone or '' }}">
                </div>
                <div class="text-end">
                    <a href="{{ url_for('insurers_list') }}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
