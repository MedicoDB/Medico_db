{% extends "layout.html" %}
{% block title %}Specialty Heads{% endblock %}
{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Department Heads</h1>
        <a href="{{ url_for('specialty_head_add') }}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add Head</a>
    </div>
    <div class="card shadow">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-dark">
                    <tr><th>ID</th><th>Specialty</th><th>Head Name</th><th>Email</th><th>Actions</th></tr>
                </thead>
                <tbody>
                    {% for h in heads %}
                    <tr>
                        <td>{{ h.head_id }}</td>
                        <td>{{ h.specialty }}</td>
                        <td><strong>{{ h.head_name }}</strong></td>
                        <td>{{ h.head_email }}</td>
                        <td>
                            <a href="{{ url_for('specialty_head_edit', head_id=h.head_id) }}" class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></a>
                            <form action="{{ url_for('specialty_head_delete', head_id=h.head_id) }}" method="POST" style="display:inline;">
                                <button class="btn btn-sm btn-danger" onclick="return confirm('Delete?')"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
