{% extends "layout.html" %}
{% block title %}Add Specialty Head{% endblock %}
{% block content %}
<div class="container" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header bg-primary text-white"><h5>Assign New Head</h5></div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3"><label>Specialty</label><input type="text" class="form-control" name="specialty" required></div>
                <div class="mb-3"><label>Head Name</label><input type="text" class="form-control" name="head_name" required></div>
                <div class="mb-3"><label>Email</label><input type="email" class="form-control" name="head_email"></div>
                
                <div class="mb-3">
                    <label>Link to Provider Record</label>
                    <select id="select-provider" name="head_provider_id">
                        <option value="">Select Provider...</option>
                        {% for p in providers %}
                        <option value="{{ p.provider_id }}">{{ p.name }} ({{ p.provider_id }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="text-end"><button type="submit" class="btn btn-primary">Save</button></div>
            </form>
        </div>
    </div>
</div>
<script>new TomSelect("#select-provider",{create:false});</script>
{% endblock %}
