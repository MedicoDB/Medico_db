{% extends "layout.html" %}
{% block title %}Add New Claim{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4"><i class="bi bi-plus-circle"></i> Add New Claim</h2>
    
    <form method="POST" class="card p-4 shadow-sm">
        <div class="row g-3">
            <div class="col-md-6">
                <label for="encounter_id" class="form-label">Encounter ID *</label>
                <select class="form-select" id="encounter_id" name="encounter_id" required>
                    <option value="" selected disabled>Select Encounter...</option>
                    {% for enc in encounters %}
                    <option value="{{ enc.encounter_id }}">
                        {{ enc.encounter_id }} - {{ enc.visit_date }} ({{ enc.patient_first_name }} {{ enc.patient_last_name }})
                    </option>
                    {% endfor %}
                </select>
                <div class="form-text">Select the patient visit related to this claim.</div>
            </div>

            <div class="col-md-6">
                <label for="insurance_provider" class="form-label">Insurance Provider</label>
                <input type="text" class="form-control" id="insurance_provider" name="insurance_provider" placeholder="e.g. Blue Cross, Medicare">
            </div>

            <div class="col-md-4">
                <label for="claim_billing_date" class="form-label">Billing Date *</label>
                <input type="datetime-local" class="form-control" id="claim_billing_date" name="claim_billing_date" required>
            </div>

            <div class="col-md-4">
                <label for="billed_amount" class="form-label">Billed Amount ($) *</label>
                <input type="number" step="0.01" class="form-control" id="billed_amount" name="billed_amount" required>
            </div>
            <div class="col-md-4">
                <label for="paid_amount" class="form-label">Paid Amount ($)</label>
                <input type="number" step="0.01" class="form-control" id="paid_amount" name="paid_amount" value="0.00">
            </div>

            <div class="col-md-6">
                <label for="claim_status" class="form-label">Status *</label>
                <select class="form-select" id="claim_status" name="claim_status" required>
                    {% for status in status_options %}
                    <option value="{{ status }}">{{ status }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label for="payment_method" class="form-label">Payment Method</label>
                <select class="form-select" id="payment_method" name="payment_method">
                    <option value="Insurance">Insurance</option>
                    <option value="Self-Pay">Self-Pay</option>
                    <option value="Credit Card">Credit Card</option>
                    <option value="Cash">Cash</option>
                </select>
            </div>

            <div class="col-12">
                <label for="denial_reason" class="form-label">Denial Reason (If Rejected/Denied)</label>
                <textarea class="form-control" id="denial_reason" name="denial_reason" rows="2"></textarea>
            </div>

            <div class="col-12 mt-4 d-flex justify-content-between">
                <a href="{{ url_for('claims_list') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Save Claim</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
