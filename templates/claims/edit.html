{% extends "layout.html" %}
{% block title %}Edit Claim #{{ claim.billing_id }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4"><i class="bi bi-pencil-square"></i> Edit Claim #{{ claim.billing_id }}</h2>
    
    <form method="POST" class="card p-4 shadow-sm">
        <div class="row g-3">
            <div class="col-md-6">
                <label for="encounter_id" class="form-label">Encounter ID *</label>
                <select class="form-select" id="encounter_id" name="encounter_id" required>
                    {% for enc in encounters %}
                    <option value="{{ enc.encounter_id }}" {% if enc.encounter_id == claim.encounter_id %}selected{% endif %}>
                        {{ enc.encounter_id }} - {{ enc.visit_date }} ({{ enc.patient_first_name }} {{ enc.patient_last_name }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <label for="insurance_provider" class="form-label">Insurance Provider</label>
                <input type="text" class="form-control" id="insurance_provider" name="insurance_provider" value="{{ claim.insurance_provider or '' }}">
            </div>

            <div class="col-md-4">
                <label for="claim_billing_date" class="form-label">Billing Date *</label>
                <input type="datetime-local" class="form-control" id="claim_billing_date" name="claim_billing_date" 
                       value="{{ claim.claim_billing_date.strftime('%Y-%m-%dT%H:%M') if claim.claim_billing_date else '' }}" required>
            </div>

            <div class="col-md-4">
                <label for="billed_amount" class="form-label">Billed Amount ($) *</label>
                <input type="number" step="0.01" class="form-control" id="billed_amount" name="billed_amount" value="{{ claim.billed_amount }}" required>
            </div>
            <div class="col-md-4">
                <label for="paid_amount" class="form-label">Paid Amount ($)</label>
                <input type="number" step="0.01" class="form-control" id="paid_amount" name="paid_amount" value="{{ claim.paid_amount }}">
            </div>

            <div class="col-md-6">
                <label for="claim_status" class="form-label">Status *</label>
                <select class="form-select" id="claim_status" name="claim_status" required>
                    {% for status in status_options %}
                    <option value="{{ status }}" {% if claim.claim_status == status %}selected{% endif %}>{{ status }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label for="payment_method" class="form-label">Payment Method</label>
                <select class="form-select" id="payment_method" name="payment_method">
                    <option value="Insurance" {% if claim.payment_method == 'Insurance' %}selected{% endif %}>Insurance</option>
                    <option value="Self-Pay" {% if claim.payment_method == 'Self-Pay' %}selected{% endif %}>Self-Pay</option>
                    <option value="Credit Card" {% if claim.payment_method == 'Credit Card' %}selected{% endif %}>Credit Card</option>
                    <option value="Cash" {% if claim.payment_method == 'Cash' %}selected{% endif %}>Cash</option>
                </select>
            </div>

            <div class="col-12">
                <label for="denial_reason" class="form-label">Denial Reason (If Rejected/Denied)</label>
                <textarea class="form-control" id="denial_reason" name="denial_reason" rows="2">{{ claim.denial_reason or '' }}</textarea>
            </div>

            <div class="col-12 mt-4 d-flex justify-content-between">
                <a href="{{ url_for('claim_view', billing_id=claim.billing_id) }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-warning"><i class="bi bi-check-lg"></i> Update Claim</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
