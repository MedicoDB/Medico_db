{% extends "layout.html" %}

{% block title %}Add Medication{% endblock %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Add New Medication</h1>
        <a href="{{ url_for('medications_list') }}" class="btn btn-secondary">Back</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" action="{{ url_for('medication_add') }}">
                
                <h5 class="mb-3 text-primary">Link to Encounter</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-12">
                        <label class="form-label fw-bold">Select Encounter *</label>
                        <select id="select-encounter" name="encounter_id" placeholder="Search encounter by patient name or ID..." required>
                            <option value="">Select...</option>
                            {% for enc in encounters %}
                            <option value="{{ enc.encounter_id }}">
                                {{ enc.encounter_id }} - {{ enc.patient_first_name }} {{ enc.patient_last_name }} ({{ enc.visit_date }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <h5 class="mb-3 text-primary">Drug Details</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Drug Name *</label>
                        <input type="text" class="form-control" name="drug_name" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Dosage</label>
                        <input type="text" class="form-control" name="dosage" placeholder="e.g. 500mg">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Route</label>
                        <select class="form-select" name="route">
                            <option value="Oral">Oral</option>
                            <option value="IV">IV</option>
                            <option value="Topical">Topical</option>
                            <option value="Inhale">Inhale</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Frequency</label>
                        <input type="text" class="form-control" name="frequency" placeholder="e.g. 2x Daily">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Duration</label>
                        <input type="text" class="form-control" name="duration" placeholder="e.g. 7 Days">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Prescribed Date</label>
                        <input type="date" class="form-control" name="prescribed_date" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Cost ($)</label>
                        <input type="number" step="0.01" class="form-control" name="cost">
                    </div>
                </div>

                <h5 class="mb-3 text-primary">Prescriber</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Prescribing Doctor</label>
                        <select id="select-provider" name="prescriber_id">
                            <option value="">Select Doctor...</option>
                            {% for p in providers %}
                            <option value="{{ p.provider_id }}">{{ p.name }} ({{ p.specialty }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="text-end">
                    <button type="submit" class="btn btn-primary px-5">Save Medication</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    new TomSelect("#select-encounter", { create: false, sortField: { field: "text", direction: "asc" } });
    new TomSelect("#select-provider", { create: false, sortField: { field: "text", direction: "asc" } });
</script>
{% endblock %}
