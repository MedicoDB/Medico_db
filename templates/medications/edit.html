{% extends "layout.html" %}

{% block title %}Edit Medication{% endblock %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Edit Medication: {{ medication.medication_id }}</h1>
        <a href="{{ url_for('medications_list') }}" class="btn btn-secondary">Back</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" action="{{ url_for('medication_edit', med_id=medication.medication_id) }}">
                
                <h5 class="mb-3 text-primary">Link to Encounter</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-12">
                        <label class="form-label fw-bold">Select Encounter</label>
                        <select id="select-encounter" name="encounter_id" required>
                            {% for enc in encounters %}
                            <option value="{{ enc.encounter_id }}" {% if medication.encounter_id == enc.encounter_id %}selected{% endif %}>
                                {{ enc.encounter_id }} - {{ enc.patient_first_name }} {{ enc.patient_last_name }} ({{ enc.visit_date }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <h5 class="mb-3 text-primary">Drug Details</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Drug Name</label>
                        <input type="text" class="form-control" name="drug_name" value="{{ medication.drug_name }}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Dosage</label>
                        <input type="text" class="form-control" name="dosage" value="{{ medication.dosage }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Route</label>
                        <select class="form-select" name="route">
                            <option value="Oral" {% if medication.route == 'Oral' %}selected{% endif %}>Oral</option>
                            <option value="IV" {% if medication.route == 'IV' %}selected{% endif %}>IV</option>
                            <option value="Topical" {% if medication.route == 'Topical' %}selected{% endif %}>Topical</option>
                            <option value="Inhale" {% if medication.route == 'Inhale' %}selected{% endif %}>Inhale</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Frequency</label>
                        <input type="text" class="form-control" name="frequency" value="{{ medication.frequency }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Duration</label>
                        <input type="text" class="form-control" name="duration" value="{{ medication.duration }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Prescribed Date</label>
                        <input type="date" class="form-control" name="prescribed_date" value="{{ medication.prescribed_date }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Cost ($)</label>
                        <input type="number" step="0.01" class="form-control" name="cost" value="{{ medication.cost }}">
                    </div>
                </div>

                <h5 class="mb-3 text-primary">Prescriber</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Prescribing Doctor</label>
                        <select id="select-provider" name="prescriber_id">
                            {% for p in providers %}
                            <option value="{{ p.provider_id }}" {% if medication.prescriber_id == p.provider_id %}selected{% endif %}>
                                {{ p.name }} ({{ p.specialty }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="text-end">
                    <button type="submit" class="btn btn-primary px-5">Update Medication</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    new TomSelect("#select-encounter", { create: false, sortField: { field: "text", direction: "asc" } });
    new TomSelect("#select-provider", { create: false, sortField: { field: "text", direction: "asc" } });
</script>
{% endblock %}
