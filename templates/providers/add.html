{% extends "layout.html" %}
{% block title %}Add Provider{% endblock %}
{% block content %}
<div class="container" style="max-width: 800px;">
    <div class="card shadow">
        <div class="card-header bg-primary text-white"><h5>Add Provider</h5></div>
        <div class="card-body">
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6"><label>Name *</label><input type="text" class="form-control" name="name" required></div>
                    <div class="col-md-6"><label>Department</label><input type="text" class="form-control" name="department"></div>
                    <div class="col-md-6"><label>Specialty</label><input type="text" class="form-control" name="specialty"></div>
                    <div class="col-md-6"><label>NPI</label><input type="text" class="form-control" name="npi"></div>
                    <div class="col-md-6"><label>Email</label><input type="email" class="form-control" name="email"></div>
                    <div class="col-md-6"><label>Years Exp.</label><input type="number" class="form-control" name="years_experience"></div>
                    <div class="col-md-6"><label>Location</label><input type="text" class="form-control" name="location"></div>
                    <div class="col-md-6">
                        <label>Reports To (Head)</label>
                        <select class="form-select" name="head_id">
                            <option value="">None</option>
                            {% for h in heads %}<option value="{{ h.head_id }}">{{ h.head_name }} ({{ h.specialty }})</option>{% endfor %}
                        </select>
                    </div>
                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="inhouse" checked>
                            <label class="form-check-label">In-House Provider?</label>
                        </div>
                    </div>
                    <div class="col-12 text-end"><button type="submit" class="btn btn-primary px-5">Save</button></div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
